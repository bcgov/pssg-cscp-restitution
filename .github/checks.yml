# What ci lints and tests on every pull request. The app team keeps this list.
# It only reports: a failure shows in ci's comment on the pull request and never blocks a merge.
# Leave out tests that need a database, a secret or a running service.
#
# Write folders, and ci runs what each one holds:
#   a package.json      lint: npm run lint                        tests: npm run test:ci, or npm test
#   a .csproj or .sln   lint: dotnet format --verify-no-changes   tests: dotnet test
#
# This repo's folders:
#   restitution-api   restitution-app             .NET
#   restitution-ui    restitution-app/ClientApp   Angular
#
# To lint both and run the tests of restitution-ui, set:
#   lint: [restitution-app, restitution-app/ClientApp]
#   tests: [restitution-app/ClientApp]
# A .NET test project is listed by its own folder. With restitution-api's tests in restitution-app.Tests:
#   tests: [restitution-app/ClientApp, restitution-app.Tests]

lint: []
tests: []
