# Moves a build from one tag to the next, by hand, then waits until it runs and is ready. With a version a release
# cut, every image moves together: test takes that version, and prod takes it only when test runs it.
# Without one, test takes what dev has, or one exact build you name, and prod takes what test has.
# prod moves now or at a set time. What was there before is kept as the backup. scan.yml scans each build first: a promote
# to prod stops when a build has a fixable HIGH or CRITICAL that .trivyignore does not hold.
name: promote
# The title of the run in the Actions list.
run-name: ${{ inputs.action }} ${{ inputs.service }} → ${{ inputs.to }} ${{ inputs.version }}${{ inputs.build }}${{ inputs.at != '' && format(' at {0} Pacific', inputs.at) || '' }}

# When it runs: only by hand, with these six choices.
on:
  workflow_dispatch:
    inputs:
      action:
        description: promote moves a build forward; rollback puts the previous one back
        type: choice
        options: [promote, rollback]
      to:
        description: the tag that changes
        type: choice
        options: [test, prod]
      service:
        description: one image, or all of them
        type: choice
        options: [all, restitution-api, restitution-ui]
      version:
        description: a version a release cut, like 1.1.14. It moves every image. Empty means by tag, as before
        default: ''
      build:
        description: promote to test only, without a version - one exact build, like sha-a1b2c3d. Empty means what dev has
        default: ''
      at:
        description: promote to prod only - the time to promote at, Pacific, like 2026-11-04 19:00. Empty means now
        default: ''

permissions:
  contents: read
  issues: write

# Two promotes with a version to the same environment never run at once, so every image of one moves before the
# next starts. A rollback, or a promote with no version, is never held behind one.
concurrency:
  group: promote-${{ inputs.version != '' && inputs.to || github.run_id }}
  cancel-in-progress: false

jobs:
  # The choices are checked first, so no reviewer is asked to approve a promote that cannot work.
  check:
    runs-on: ubuntu-24.04
    steps:
      # A version moves every image, and a time is for prod only. A time is refused when it has passed, or is more
      # than 30 days ahead: GitHub's wait timer holds 1 to 43,200 minutes.
      - name: check the choices
        env:
          AT: ${{ inputs.at }}
          ACTION: ${{ inputs.action }}
          TO: ${{ inputs.to }}
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          no() { echo "::error::$1"; exit 1; }
          [[ -z "$VERSION" || "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || no "Write the version like 1.1.14."
          [ -z "$VERSION" ] || [ "$ACTION" = promote ] || no "A rollback puts the backup back, so it takes no version."
          [ -z "$VERSION" ] || [ "$SERVICE" = all ] || no "A version moves every image together: choose all."
          [ -z "$BUILD" ] || { [ -z "$VERSION" ] && [ "$TO" = test ]; } || no "A build is for test only, and not with a version."
          [ -n "$AT" ] || exit 0
          [ "$ACTION" = promote ] && [ "$TO" = prod ] || no "A time is for a promote to prod only."
          [[ "$AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\ [0-9]{2}:[0-9]{2}$ ]] && date -d "$AT" > /dev/null || no "Write the time like 2026-11-04 19:00."
          MIN=$(( ($(TZ=America/Vancouver date -d "$AT" +%s) - $(date +%s) + 59) / 60 ))
          [ "$MIN" -ge 1 ] && [ "$MIN" -le 43200 ] || { echo "::error::$AT Pacific has passed, or is more than 30 days ahead."; exit 1; }

  # Scan each build before it moves, before any reviewer is asked. For test it only reports. For prod it stops every
  # image when one has a fixable HIGH or CRITICAL that .trivyignore does not hold, or cannot be scanned. With a version
  # it also stops when the environment before does not run it. The promote below moves the very build scanned here.
  # A promote at a set time is scanned when it is booked. A rollback is not scanned.
  scan:
    needs: check
    if: inputs.action == 'promote'
    uses: ./.github/workflows/scan.yml
    permissions:
      contents: read
      issues: write
    secrets: inherit
    with:
      tag: ${{ inputs.version || inputs.to == 'prod' && 'test' || inputs.build || 'dev' }}
      images: ${{ inputs.service == 'all' && '["restitution-api","restitution-ui"]' || format('["{0}"]', inputs.service) }}
      stop: ${{ inputs.to == 'prod' }}
      same: ${{ inputs.version != '' && (inputs.to == 'prod' && 'test' || '') || '' }}

  # A promote at a set time: one of prod's reviewers approves it now. Then prod-at's timer is set to the minutes
  # left, and the promote below waits on it.
  timer:
    needs: [check, scan]
    if: inputs.at != ''
    runs-on: ubuntu-24.04
    # The prod environment waits for one of its reviewers, and holds RELEASE_TIMER_TOKEN.
    environment: prod
    # What it may do: see which promote runs are waiting, and open an issue.
    permissions:
      actions: read
      issues: write
    steps:
      # Count the minutes left, now that it is approved. A time that passed while it waited is refused.
      - name: minutes left
        id: left
        env:
          AT: ${{ inputs.at }}
        run: |
          MIN=$(( ($(TZ=America/Vancouver date -d "$AT" +%s) - $(date +%s) + 59) / 60 ))
          [ "$MIN" -ge 1 ] && [ "$MIN" -le 43200 ] || { echo "::error::$AT Pacific has passed, or is more than 30 days ahead."; exit 1; }
          echo "minutes=$MIN" >> "$GITHUB_OUTPUT"
      # One timed release at a time: the timer is one setting on prod-at, so another timed promote that waits stops this one.
      - name: one at a time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WAITING=$(gh run list -R "$GITHUB_REPOSITORY" -w promote.yml -s waiting --json displayTitle --jq '.[].displayTitle | select(endswith(" Pacific"))')
          [ -z "$WAITING" ] || { echo "::error::Another timed release waits: $WAITING. Cancel it, or wait until it has run."; exit 1; }
      # Set prod-at's timer to those minutes, with the one token here that may change the repo's environments.
      # The other settings stay: no admin can skip the timer, and only the default branch may use prod-at.
      - name: set the timer
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TIMER_TOKEN }}
          MIN: ${{ steps.left.outputs.minutes }}
        run: |
          jq -n --argjson m "$MIN" '{wait_timer: $m, can_admins_bypass: false, deployment_branch_policy: {protected_branches: false, custom_branch_policies: true}}' \
            | gh api -X PUT "repos/$GITHUB_REPOSITORY/environments/prod-at" --input - > /dev/null
          echo "Approved. The promote waits on prod-at for $MIN minutes." >> "$GITHUB_STEP_SUMMARY"
      # If anything above failed, open an issue for DevOps.
      - name: open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "promote failed: prod" --label cicd --assignee rohithvarmayadla \
            --body "The timed promote of ${{ inputs.service }} to prod was not set, started by $GITHUB_ACTOR. Nothing moved. The run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  promote:
    needs: [check, scan, timer]
    # It runs when nothing before it failed. A promote now skips the timer, and a rollback skips the scan.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    # The environment holds PROMOTER_TOKEN and NAMESPACE: test, prod, or prod-at for a promote at a set time.
    # prod waits for one of its reviewers. prod-at waits on its timer: prod's reviewer approved it at the start.
    environment: ${{ inputs.at != '' && 'prod-at' || inputs.to }}
    # One job per image you chose: every image for all, or only the one you picked.
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.service == 'all' && '["restitution-api","restitution-ui"]' || format('["{0}"]', inputs.service)) }}
    name: ${{ matrix.image }}
    # Two promotes of the same image in the same environment never run at once. A timed one waits in a group
    # of its own, so a promote or a rollback now is never held behind it.
    concurrency:
      group: promote-${{ inputs.at != '' && 'prod-at' || inputs.to }}-${{ matrix.image }}
      cancel-in-progress: false
    # TOOLS is where the tags live, and NAMESPACE where the environment runs. FROM is the tag to take, and SAME, with
    # a version, the environment that must run it already.
    env:
      TOOLS: ${{ secrets.REGISTRY_NAMESPACE }}
      NAMESPACE: ${{ secrets.NAMESPACE }}
      TO: ${{ inputs.to }}
      FROM: ${{ inputs.version || inputs.to == 'prod' && 'test' || inputs.build || 'dev' }}
      SAME: ${{ inputs.version != '' && (inputs.to == 'prod' && 'test' || '') || '' }}
      VERSION: ${{ inputs.version }}
    steps:
      # Install oc.
      - uses: redhat-actions/openshift-tools-installer@37eb3cfb20ac2df6f0511ffa71cd917e4d49cabf # v3.1
        with:
          oc: "4"
      # Sign in to the cluster as github-promoter.
      - name: oc login
        run: oc login --server="$CLUSTER_SERVER" --token="$PROMOTER_TOKEN"
        env:
          CLUSTER_SERVER: ${{ secrets.CLUSTER_SERVER }}
          PROMOTER_TOKEN: ${{ secrets.PROMOTER_TOKEN }}
      # With a version, every image moves or none does: each one needs the build the scan read, and the environment
      # before must still run it, and the version's release page must say it reached there: that line is written only
      # once a promote there finished and its builds were ready, which a tag alone cannot show. A promote at a set time
      # can wait days, so this is checked again now, before anything moves.
      - name: every image has this version
        if: inputs.action == 'promote' && env.VERSION != ''
        env:
          SCANNED: ${{ toJSON(needs.scan.outputs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$SAME" ]; then
            gh release view "$VERSION" -R "$GITHUB_REPOSITORY" --json body --jq .body 2> /dev/null | grep -qE "^Reached .*\b$SAME\b" ||
              { echo "::error::The release page of $VERSION does not say it reached $SAME, so nothing moved."; exit 1; }
          fi
          for I in restitution-api restitution-ui; do
            W=$(echo "$SCANNED" | jq -r --arg i "$I" '.[$i] // empty')
            [ -n "$W" ] || { echo "::error::$I has no build of $VERSION that the scan read, so nothing moved."; exit 1; }
            [ -z "$SAME" ] || [ "$(oc -n "$TOOLS" get istag "$I:$SAME" -o jsonpath='{.image.metadata.name}' 2>/dev/null || true)" = "$W" ] ||
              { echo "::error::$SAME does not run $VERSION for $I now, so nothing moved."; exit 1; }
          done
      # Promote: keep what is there now as the backup, then move the tag to the very build the scan read, by its
      # digest, so a source tag that moved since cannot slip in a build it never read. Prod and a version never move without it.
      - name: promote
        if: inputs.action == 'promote'
        env:
          SCANNED: ${{ needs.scan.outputs[matrix.image] }}
        run: |
          if [ -n "$SCANNED" ]; then SRC="$TOOLS/${{ matrix.image }}@$SCANNED"
          elif [ "$TO" = prod ] || [ -n "$VERSION" ]; then echo "::error::No scanned build to move, so nothing moved."; exit 1
          else SRC="$TOOLS/${{ matrix.image }}:$FROM"; fi
          oc tag "$TOOLS/${{ matrix.image }}:$TO" "$TOOLS/${{ matrix.image }}:$TO-backup" --reference-policy=local || echo "nothing to back up yet"
          oc tag "$SRC" "$TOOLS/${{ matrix.image }}:$TO" --reference-policy=local
      # Rollback: put the backup back.
      - name: rollback
        if: inputs.action == 'rollback'
        run: oc tag "$TOOLS/${{ matrix.image }}:$TO-backup" "$TOOLS/${{ matrix.image }}:$TO" --reference-policy=local
      # Check: wait until OpenShift runs the build the tag now names, in every Deployment and CronJob of the environment
      # that runs this image, and each Deployment is ready: its own health checks pass. A CronJob runs the build from
      # its next run. 10 minutes at most; if not, it fails here.
      - name: check
        timeout-minutes: 10
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          WANT=$(oc -n "$TOOLS" get istag "$IMAGE:$TO" -o jsonpath='{.image.metadata.name}')
          RUNS=$({ oc -n "$NAMESPACE" get deploy -o jsonpath='{range .items[*]}deployment/{.metadata.name} {.spec.template.spec.containers[*].image}{"\n"}{end}'; oc -n "$NAMESPACE" get cronjob -o jsonpath='{range .items[*]}cronjob/{.metadata.name} {.spec.jobTemplate.spec.template.spec.containers[*].image}{"\n"}{end}' 2>/dev/null || true; } | grep "/${IMAGE}[@:]" | cut -d' ' -f1)
          [ -n "$RUNS" ] || { echo "::error::Nothing in $TO runs $IMAGE."; exit 1; }
          for D in $RUNS; do
            # A CronJob that names the tag itself pulls it at every run, so it already follows the move.
            P='{.spec.template.spec.containers[*].image}'; M="@$WANT"
            [ "${D%%/*}" = cronjob ] && P='{.spec.jobTemplate.spec.template.spec.containers[*].image}' && M="@$WANT|/$IMAGE:$TO( |\$)"
            until oc -n "$NAMESPACE" get "$D" -o jsonpath="$P" | grep -qE "$M"; do sleep 10; done
            if [ "${D%%/*}" = cronjob ]; then
              echo "**${D#*/}** runs $IMAGE at \`$WANT\` in $TO from its next run." >> "$GITHUB_STEP_SUMMARY"
            else
              oc -n "$NAMESPACE" rollout status "$D" --timeout=10m
              echo "**${D#*/}** runs $IMAGE at \`$WANT\` in $TO, and is ready." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      # If anything above failed, open an issue for DevOps.
      - name: open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "promote failed: ${{ inputs.to }}" --label cicd --assignee rohithvarmayadla \
            --body "${{ inputs.action }} of ${{ matrix.image }} to ${{ inputs.to }} failed, or its build was not ready within 10 minutes, started by $GITHUB_ACTOR. The app team can roll back. The run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # With a version: note on its release page each environment it has reached.
  record:
    needs: promote
    if: ${{ !cancelled() && inputs.version != '' && needs.promote.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: the release page
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TO: ${{ inputs.to }}
        run: |
          gh release view "$VERSION" -R "$GITHUB_REPOSITORY" --json body --jq .body > notes.md || { echo "::warning::$VERSION has no release page."; exit 0; }
          if ! grep -q "^Reached " notes.md; then printf '\nReached %s.\n' "$TO" >> notes.md
          elif ! grep -qE "^Reached .*\b$TO\b" notes.md; then sed -i -E "s/^(Reached .*)\.$/\1, $TO./" notes.md; fi
          gh release edit "$VERSION" -R "$GITHUB_REPOSITORY" --notes-file notes.md
