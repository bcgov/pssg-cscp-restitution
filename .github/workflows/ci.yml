# Checks every pull request into development. For each image the pull request touches: the Dockerfile check,
# the docker build and Trivy. SonarQube reads the code once, and the lint and tests listed in .github/checks.yml run.
# The job ci is the one result. pr-report.yml then writes what all of it found as one comment on the pull request.
name: ci

# When it runs: a pull request into development.
on:
  pull_request:
    branches: [development]

# What it may do: read the code and the pull request, and write Trivy's findings to the Security tab.
permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read # the report step reads its own run

# A new push to the pull request cancels the run before it.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # One line per image. context is the folder its Dockerfile's COPY paths start from.
    # The steps below run once for each image.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: restitution-api, dockerfile: restitution-app/Dockerfile, context: ., watch: '{restitution-app,Database}/**', args: '--build-arg BUILD_IMAGE_NAME=restitution-api --build-arg BUILD_VERSION=$GITHUB_SHA' }
          - { image: restitution-ui, dockerfile: restitution-app/ClientApp/Dockerfile, context: ., watch: 'restitution-app/ClientApp/**', args: '--build-arg BUILD_IMAGE_NAME=restitution-ui --build-arg BUILD_VERSION=$GITHUB_SHA' }
    name: ${{ matrix.image }}
    steps:
      # Get the code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Does this pull request touch this image? The steps below run only when it does.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changed
        with:
          filters: |
            yes: ['${{ matrix.watch }}', '${{ matrix.dockerfile }}', '.dockerignore', '.github/workflows/**']
      # Check the Dockerfile with hadolint. Its findings are in the log and never stop the pull request.
      - name: Dockerfile check
        if: steps.changed.outputs.yes == 'true'
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --no-fail -f json - < ${{ matrix.dockerfile }} > hadolint.json
          jq -r '.[] | "line \(.line): \(.code) \(.message)"' hadolint.json
      # Build the image, the same way cd builds it.
      - name: docker build
        id: build
        if: steps.changed.outputs.yes == 'true'
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }}:ci ${{ matrix.args }} ${{ matrix.context }}
      # Scan the image. It reports what it finds and never stops the pull request.
      - name: Trivy
        id: trivy
        if: steps.changed.outputs.yes == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          limit-severities-for-sarif: true
      # Send Trivy's findings to GitHub, under Security, Code scanning. A fork's token cannot: there they are on the Summary only.
      - name: report to GitHub
        if: always() && hashFiles('trivy.sarif') != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.image }}
      # Put what Trivy found on the run's Summary, as a table. It changes nothing else.
      - name: findings on the summary
        if: always() && hashFiles('trivy*.sarif') != ''
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          for F in trivy*.sarif; do
            W=$IMAGE; [ "$F" = trivy.sarif ] || W="the npm packages of $IMAGE"
            N=$(jq '[.runs[].results[]] | length' "$F")
            echo "### Trivy, $W: $N fixable HIGH or CRITICAL" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$N" -eq 0 ] || { echo "| CVE | Package | Installed | Fixed in | Severity |"; echo "|---|---|---|---|---|"; jq -r '.runs[].results[] | (.message.text | split("\n") | map(capture("^(?<key>[^:]+): (?<value>.*)$")?) | from_entries) as $m | "| \(.ruleId) | \($m.Package) | \($m["Installed Version"]) | \($m["Fixed Version"]) | \($m.Severity) |"' "$F" | sort -u; } | tee -a "$GITHUB_STEP_SUMMARY"
          done
      # Keep what this run found, for the comment on this pull request.
      # A scan that did not finish is kept as such, never as one that found nothing.
      - name: note what it found
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
          BUILT: ${{ steps.build.outcome }}
          SCANNED: ${{ steps.trivy.outcome }}
        run: |
          T='[]'; [ ! -f trivy.sarif ] || T=$(jq -c '[.runs[].results[].ruleId] | unique' trivy.sarif)
          H=null; [ ! -f hadolint.json ] || H=$(jq length hadolint.json)
          jq -n --arg i "$IMAGE" --arg b "$BUILT" --arg s "$SCANNED" --argjson t "$T" --argjson h "$H" '{image: $i, build: $b, scan: $s, trivy: $t, hadolint: $h}' > found.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-${{ matrix.image }}
          path: found.json
          retention-days: 14

  # Read the code with SonarQube. It reports on the Sonar server and never stops the pull request.
  # Pull requests from Dependabot and from a fork cannot read the two secrets, so they are left out. Sonar reads that code after the merge, in cd.
  sonar:
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      # Get the code with its history: SonarQube compares with what was there before.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # .NET code is read only while it is built. Set up the SDK the Dockerfile builds with.
      - id: dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0"
      # Sonar's rules print each issue as a build warning. Keep them off the pull request: the Summary has the count and the link.
      - name: no build warnings on the pull request
        run: echo "::remove-matcher owner=csc::"
      # Install SonarQube's scanner for .NET. Its version is kept by hand: Dependabot does not read this line.
      - name: install the scanner
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0
      # Begin: name the project, and say what to read and what to leave out. The token is a GitHub secret, and the address the variable SONAR_URL.
      - name: SonarQube begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL }}
        run: |
          dotnet sonarscanner begin /k:"pssg-cscp-restitution" /n:"pssg cscp restitution" \
            /d:sonar.host.url="$SONAR_HOST_URL" /d:sonar.token="$SONAR_TOKEN" /d:sonar.projectBaseDir="$GITHUB_WORKSPACE" \
            /d:sonar.inclusions="**/restitution-app/**,**/restitution-app/ClientApp/**" \
            /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/.angular/**,**/obj/**,**/bin/**,**/coverage/**,**/*.spec.ts,**/*.test.ts"
      # The runner holds newer SDKs too, and dotnet builds with the newest unless a global.json names one.
      # Name the SDK set up above, the one the Dockerfile builds with.
      - name: build with the SDK set up above
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --force
      # Build the .NET code. The scanner reads it as it compiles.
      - name: dotnet build
        run: dotnet build restitution-app
      # End: read the other files, and send everything to the Sonar server.
      - name: SonarQube end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      # What Sonar found, on the run's Summary: the open issues by type, the quality gate and a link. It changes nothing else.
      - name: Sonar on the summary
        if: always() && vars.SONAR_URL != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL }}
          SONAR_URL: ${{ vars.SONAR_URL }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          K=pssg-cscp-restitution; W="$GITHUB_REF_NAME"; Q="projectKey=$K"
          if [ -n "$PR" ]; then W="this pull request"; Q="$Q&pullRequest=$PR"; fi
          LINK="${SONAR_URL%/}/dashboard?id=$K${PR:+&pullRequest=$PR}"
          T=$(find . -name report-task.txt -not -path '*/node_modules/*' 2>/dev/null | head -1); TASK=""
          [ -z "$T" ] || TASK=$(sed -n "s/^ceTaskUrl=//p" "$T")
          [ -z "$TASK" ] || for _ in $(seq 1 36); do S=$(curl -s -u "$SONAR_TOKEN:" "$TASK" | jq -r '.task.status // empty'); case "$S" in SUCCESS|FAILED|CANCELED) break;; esac; sleep 5; done
          G=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/qualitygates/project_status?$Q" | jq -r '.projectStatus.status // "not read"')
          case "$G" in OK) G=passed;; ERROR) G=failed;; esac
          I=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/issues/search?componentKeys=$K${PR:+&pullRequest=$PR}&resolved=false&ps=1&facets=types")
          N=$(echo "$I" | jq -r '.total // "?"')
          C() { echo "$I" | jq -r --arg t "$1" '[.facets[]?.values[]? | select(.val == $t) | .count][0] // 0'; }
          echo "### SonarQube, $W: $N open issues ($(C BUG) bugs, $(C VULNERABILITY) vulnerabilities, $(C CODE_SMELL) code smells). Quality gate: $G (reports only). [Open the results]($LINK)" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -n --arg g "$G" --arg n "$N" '{gate: $g, issues: $n}' > sonar.json
      # Keep the gate and the count for the comment on this pull request.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('sonar.json') != ''
        with:
          name: sonar
          path: sonar.json
          retention-days: 14

  # Lint and tests: the folders listed in .github/checks.yml, which the team keeps. They report and never stop the
  # pull request. Tests that need a database, a secret or a live service are not listed there.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Read the folders to lint and to test. A file that lists none runs nothing.
      - name: read checks.yml
        id: list
        run: |
          for K in lint tests; do
            V=null; [ ! -f .github/checks.yml ] || V=$(yq -o=json -I=0 ".$K" .github/checks.yml)
            echo "$K=$(echo "$V" | jq -c 'if type == "array" then map(tostring) elif type == "string" then [.] else [] end')" >> "$GITHUB_OUTPUT"
          done
          echo '[]' > checks.json
      - if: steps.list.outputs.lint != '[]' || steps.list.outputs.tests != '[]'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - if: steps.list.outputs.lint != '[]' || steps.list.outputs.tests != '[]'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0"
      # Run each one, and note passed or failed. A failure shows on the pull request and stops nothing.
      - name: lint and tests
        if: steps.list.outputs.lint != '[]' || steps.list.outputs.tests != '[]'
        env:
          LINT: ${{ steps.list.outputs.lint }}
          TESTS: ${{ steps.list.outputs.tests }}
        run: |
          set +e
          echo "| Check | Folder | Result |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          one() {
            K=$1; D=$2; CMD=""
            if [ -f "$D/package.json" ]; then
              if [ "$K" = lint ]; then CMD="npm run lint"
              elif jq -e '.scripts["test:ci"]' "$D/package.json" > /dev/null; then CMD="npm run test:ci"
              elif grep -q '"@angular/core"' "$D/package.json"; then CMD="npm test -- --watch=false --browsers=ChromeHeadless"
              else CMD="npm test"; fi
              CMD="npm ci --no-audit --no-fund && $CMD"
            elif compgen -G "$D/*.csproj" > /dev/null || compgen -G "$D/*.sln" > /dev/null; then
              CMD="dotnet test"; [ "$K" = tests ] || CMD="dotnet format --verify-no-changes"
            fi
            if [[ ! -d "$D" || "$D" == /* || "$D" == *..* ]]; then R="no such folder"
            elif [ -z "$CMD" ]; then R="no package.json or .csproj"
            else echo "::group::$K, $D"; if (cd "$D" && eval "$CMD"); then R=passed; else R=failed; fi; echo "::endgroup::"; fi
            echo "| $K | $D | $R |" >> "$GITHUB_STEP_SUMMARY"
            jq --arg k "$K" --arg d "$D" --arg r "$R" '. + [{kind: $k, dir: $d, result: $r}]' checks.json > c.json && mv c.json checks.json
          }
          while IFS= read -r D; do one lint "$D"; done < <(echo "$LINT" | jq -r '.[]')
          while IFS= read -r D; do one tests "$D"; done < <(echo "$TESTS" | jq -r '.[]')
      # Keep the results for the comment on this pull request.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks
          path: checks.json
          retention-days: 14

  # One result for the whole pull request. It fails when any image above failed. Lint and tests only report.
  ci:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - if: needs.build.result != 'success'
        run: exit 1
